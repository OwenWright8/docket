# Docket: your to-do list and reminders, filled in by a local AI.
#
#     docker compose up -d
#
# then open http://<this-machine>:8585, create your account, and follow the
# three setup steps (your local AI, notifications, email). Everything lives
# in the `docket-data` volume (back it up).
#
# Set TZ to your time zone: "today", reminder times and the morning summary
# all go by it.

x-logging: &default-logging
  # Docker's default json-file driver never rotates.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  docket:
    # `docker compose up -d` pulls the prebuilt image; `docker compose up -d
    # --build` builds it from this folder instead.
    image: ${DOCKET_IMAGE_REPO:-ghcr.io/owenwright8/docket}:${DOCKET_VERSION:-latest}
    build:
      context: .
    container_name: docket
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Indiana/Indianapolis}
      # "off" stops the app from checking GitHub for new releases.
      UPDATE_CHECK: ${UPDATE_CHECK:-on}
    volumes:
      - docket-data:/data
    # Lets the app reach Ollama running on the Docker host itself as
    # http://host.docker.internal:11434 (on Linux too). Ollama on another PC
    # is reached by its LAN address instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${APP_PORT:-8585}:8585"

volumes:
  docket-data:
